# This config uses the Catppuccin tmux plugin with an Everforest Dark Hard palette.
#
# It requires the matching theme file in the Catppuccin plugin themes directory:
# cp ~/.config/tmux/themes/everforest-dark-hard.conf ~/.config/tmux/plugins/tmux/themes/catppuccin_everforest_dark_hard_tmux.conf
#
# Palette source: https://github.com/sainnhe/everforest

set -g @catppuccin_flavor "everforest_dark_hard"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"
set -g @catppuccin_status_modules_right ""

# Load the UI.
source-file ~/.config/tmux/tmux.ui.conf
