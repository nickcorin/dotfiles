[default_session]
windows = ["code"]

[[session]]
name = "arena"
path = "$PROJECTS_DIR/arenasports/arena"
windows = ["opencode", "code"]

[[window]]
name = "code"
startup_command = "nvim -c 'lua Snacks.picker.recent({filter={cwd=true}})' {}"

[[window]]
name = "opencode"
startup_command = "opencode"
